name: CI

on:
  pull_request:
    paths:
      - "react-typescript-preferences/**"
      - "tapio-react-preferences/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "*.md"
      - ".markdownlint.json"
  push:
    paths:
      - "react-typescript-preferences/**"
      - "tapio-react-preferences/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "*.md"
      - ".markdownlint.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint markdown
        run: npx -y markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Verify preferences heuristic
        run: node react-typescript-preferences/scripts/verify-preferences.mjs --all
